# Tema do dashboard = identidade visual da documentação (src/css/custom.css do site).
# Cores dos gráficos e dos cartões: src/theme.py.
[theme]
base                     = "light"
primaryColor             = "#2B4D6F"
backgroundColor          = "#F4F5F6"
secondaryBackgroundColor = "#E9ECEF"
textColor                = "#1F2933"
font                     = "sans serif"

[server]
headless = true

[client]
showSidebarNavigation = true
