# Tema do dashboard. As cores dos gráficos ficam em src/theme.py — esta seção
# cuida só do chrome da página.
[theme]
base                     = "light"
primaryColor             = "#2a78d6"
backgroundColor          = "#ffffff"
secondaryBackgroundColor = "#f4f4f1"
textColor                = "#0b0b0b"
font                     = "sans serif"

[server]
headless = true
