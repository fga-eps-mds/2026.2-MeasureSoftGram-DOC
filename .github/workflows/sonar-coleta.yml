name: Coleta de qualidade (SonarCloud)

# Consulta a Web API do SonarCloud e commita o snapshot em Analytics/data/sonar/.
# Traz o que o metrics.yml não coleta: bugs, vulnerabilidades, code smells,
# security hotspots, dívida técnica, Quality Gate, ratings e o histórico.
# O Streamlit Community Cloud republica o dashboard sozinho a cada push na main.
#
# Os projetos da organização são públicos: SONAR_TOKEN é opcional
# (Settings > Secrets and variables > Actions), só para projetos privados.

on:
  schedule:
    - cron: "37 3 * * *"      # todo dia, 00:37 em Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonar-coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Coletar do SonarCloud
        working-directory: Analytics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python scripts/coleta_sonar.py

      - name: Commitar o snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Analytics/data/sonar
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "chore(dados): snapshot do SonarCloud"
          git push

