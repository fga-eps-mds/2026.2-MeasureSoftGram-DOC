name: Coleta de velocity (Zenhub)

# Consulta a API GraphQL do Zenhub e commita o snapshot em
# Analytics/data/zenhub/velocity/. O Streamlit Community Cloud republica o
# dashboard sozinho a cada push na main.
#
# Pré-requisito: secret do repositório ZENHUB_API_KEY
# (Settings > Secrets and variables > Actions > New repository secret).
# A chave só existe aqui dentro, nunca no site publicado.

on:
  schedule:
    - cron: "17 3 * * *"      # todo dia, 00:17 em Brasília (logo após a virada da sprint)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenhub-velocity
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Coletar do Zenhub
        working-directory: Analytics
        env:
          ZENHUB_API_KEY: ${{ secrets.ZENHUB_API_KEY }}
          ZENHUB_WORKSPACE_ID: ${{ vars.ZENHUB_WORKSPACE_ID }}
        run: python scripts/coleta_velocity.py

      - name: Testes dos cálculos
        working-directory: Analytics
        run: python -m unittest discover -s tests

      - name: Commitar o snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Analytics/data/zenhub/velocity
          if git diff --cached --quiet; then echo "Sem mudanças"; exit 0; fi
          git commit -m "chore(dados): snapshot de velocity do Zenhub"
          git push

