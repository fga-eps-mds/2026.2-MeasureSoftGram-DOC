name: Coleta de dados do dashboard

# Atualiza sozinho os dados do dashboard e commita em Analytics/data/:
#   - Zenhub (sprints, pontos, backlog)   -> Analytics/data/zenhub/velocity/
#   - SonarCloud (bugs, code smells, Quality Gate, histórico...) -> Analytics/data/sonar/
#   - GitHub Actions (execuções de CI de cada repositório)     -> Analytics/data/github/
# O Streamlit Community Cloud republica o dashboard a cada commit na main.
#
# Quando roda:
#   - 3 vezes por dia (08h, 14h e 20h em Brasília);
#   - manual sob demanda: Actions > Coleta de dados do dashboard > Run workflow.
#
# Regra do SonarCloud:
#   - Só coleta do SonarCloud se houver novos PRs mergeados na branch develop (ou se 'forcar_coleta' for true).
#   - Zenhub e GitHub rodam continuamente em cada ciclo para manter sprints e CI atualizados.

on:
  schedule:
    - cron: "7 11,17,23 * * *"   # 08:07, 14:07 e 20:07 em Brasília (UTC-3)
  workflow_dispatch:
    inputs:
      forcar_coleta:
        description: "Forçar coleta do SonarCloud mesmo sem novo PR na branch develop"
        type: boolean
        default: false
      repositorios:
        description: "Repositórios para coletar (deixe 'todos' ou informe separados por vírgula, ex: Service, Front)"
        type: string
        default: "todos"
        required: false

permissions:
  contents: write
  actions: read          # ler as execuções de workflow (scripts/coleta_github.py)

concurrency:
  group: coleta-dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install pandas requests

      - name: Verificar novos PRs na develop
        id: verificar
        working-directory: Analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/verificar_novos_prs.py --repos "${{ inputs.repositorios || 'todos' }}" ${{ (inputs.forcar_coleta == true) && '--force' || '' }}

      - name: Coletar do Zenhub
        id: zenhub
        continue-on-error: true      # sem a chave ou com o Zenhub fora do ar, a coleta segue
        working-directory: Analytics
        env:
          ZENHUB_API_KEY: ${{ secrets.ZENHUB_API_KEY }}
          ZENHUB_WORKSPACE_ID: ${{ vars.ZENHUB_WORKSPACE_ID }}
        run: |
          if [ -z "$ZENHUB_API_KEY" ]; then
            echo "::warning::Secret ZENHUB_API_KEY não configurado: coleta do Zenhub pulada."
            exit 1
          fi
          python scripts/coleta_velocity.py

      - name: Coletar do SonarCloud
        if: steps.verificar.outputs.houve_novo_pr == 'true' || inputs.forcar_coleta == true
        id: sonar
        continue-on-error: true
        working-directory: Analytics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python scripts/coleta_sonar.py --repos "${{ steps.verificar.outputs.repos_alvo }}"

      - name: Coletar execuções do GitHub Actions
        id: github
        continue-on-error: true
        working-directory: Analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/coleta_github.py --repos "${{ steps.verificar.outputs.repos_alvo }}"

      - name: Testes dos cálculos
        working-directory: Analytics
        run: python -m unittest discover -s tests

      - name: Commitar os dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Analytics/data/zenhub Analytics/data/sonar Analytics/data/.last_pr_state.json $(ls -d Analytics/data/github 2>/dev/null)
          if git diff --cached --quiet; then echo "Sem dados novos"; exit 0; fi
          git commit -m "chore(dados): coleta automática do Zenhub, SonarCloud e GitHub Actions"
          git pull --rebase origin main
          git push

      - name: Resumo
        if: always()
        run: |
          echo "### Coleta de dados" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Novos PRs na develop**: \`${{ steps.verificar.outputs.houve_novo_pr || 'não verificado' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repositórios avaliados**: \`${{ steps.verificar.outputs.repos_alvo || 'todos' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Detalhes**: ${{ steps.verificar.outputs.resumo_prs || '-' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Zenhub**: ${{ steps.zenhub.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SonarCloud**: ${{ steps.sonar.outcome || 'pulado (sem PR novo)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Actions**: ${{ steps.github.outcome }}" >> "$GITHUB_STEP_SUMMARY"
